agent {
  trust_domain = "service-auth.test"
  server_address = "spire-server"
  server_port = "8081"
  data_dir = "/run/spire/data"
  socket_path = "/run/spire/agent/agent.sock"
  trust_bundle_path = "/run/spire/bootstrap/bundle.pem"
  join_token_file = "/run/spire/bootstrap/join-token"
  log_level = "WARN"
  log_format = "json"
}
plugins {
  NodeAttestor "join_token" {}
  KeyManager "memory" {}
  WorkloadAttestor "unix" {}
  WorkloadAttestor "docker" {}
}
