syntax = "proto3";

package payment.v1;

option go_package = "github.com/paveletto99/microservice-blueprint/internal/pb/payment/v1;paymentv1";

// PaymentService records simulated payments; it never transfers money.
service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
}

message CreatePaymentRequest {
  string order_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  // SHA-256 digest scoped to the authenticated HTTP client and idempotency key.
  string idempotency_digest = 4;
}

message CreatePaymentResponse {
  string payment_id = 1;
  bool replayed = 2;
}
