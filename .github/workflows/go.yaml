name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b, payment, vitess-migrate]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f Dockerfile.${{ matrix.service }} -t ${{ matrix.service }}:ci .
